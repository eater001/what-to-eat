<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Firebase 连接测试</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        h1 { color: #3e2c1b; }
        button { background: #3f2e1e; color: #fff; border: none; border-radius: 40px; padding: 14px 28px; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:disabled { background: #b8a99a; }
        pre { background: #f5f0e9; border: 1px solid #e2d4c4; border-radius: 12px; padding: 16px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; font-size: 14px; margin-top: 16px; }
        .ok { color: #2e7d32; }
        .err { color: #c0392b; }
    </style>
</head>
<body>
    <h1>🔥 Firebase 连接测试</h1>
    <p>点击下面的按钮，测试 Firebase 数据库是否能正常读写。</p>
    <button id="testBtn">测试连接</button>
    <pre id="result">等待测试...</pre>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCuY0GEdYDVMowwIGH5QxFC3IVoB_B7zFc",
            authDomain: "today-eat-what-44b8e.firebaseapp.com",
            projectId: "today-eat-what-44b8e",
            storageBucket: "today-eat-what-44b8e.firebasestorage.app",
            messagingSenderId: "898482788446",
            appId: "1:898482788446:web:ac5b3293f0552b21befccf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const resultEl = document.getElementById('result');
        const testBtn = document.getElementById('testBtn');

        testBtn.addEventListener('click', async () => {
            resultEl.textContent = '正在测试...';
            testBtn.disabled = true;
            try {
                // 1. 测试写入
                const docRef = await addDoc(collection(db, 'test'), {
                    message: 'Hello Firebase',
                    time: new Date().toISOString()
                });
                let msg = '✅ 写入成功！文档 ID: ' + docRef.id;

                // 2. 测试读取
                const querySnapshot = await getDocs(collection(db, 'test'));
                msg += '\n✅ 读取成功！共有 ' + querySnapshot.size + ' 条数据';

                // 3. 清理测试数据
                await deleteDoc(doc(db, 'test', docRef.id));
                msg += '\n✅ 清理成功';

                msg += '\n\n🎉 Firebase 连接正常，可以继续下一步！';
                resultEl.innerHTML = '<span class="ok">' + msg + '</span>';
            } catch (err) {
                console.error(err);
                resultEl.innerHTML = '<span class="err">❌ 连接失败：\n' + err.message + '\n\n错误详情：\n' + JSON.stringify(err, null, 2) + '</span>';
            } finally {
                testBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
